<body class="bg-white">
<div id="nav-placeholder"></div>

<section class="bg-gray-50 py-20 border-b border-gray-100"> <div class="max-w-6xl mx-auto px-6"> <p class="font-en text-xs tracking-[.15em] uppercase text-green-DEFAULT mb-2">News</p> <h1 class="font-serif text-3xl md:text-4xl font-medium text-gray-800 section-line">最新情報</h1> </div>
</section>
<section class="py-16 bg-white"> <div class="max-w-4xl mx-auto px-6"> <div class="flex gap-2 flex-wrap mb-8" id="filter-bar"> <button class="f-btn text-xs px-4 py-1.5 rounded-full border border-green-DEFAULT bg-green-DEFAULT text-white font-medium transition" data-cat="all">すべて</button> <button class="f-btn text-xs px-4 py-1.5 rounded-full border border-gray-200 text-gray-500 font-medium hover:border-green-DEFAULT hover:text-green-DEFAULT transition" data-cat="プレスリリース">プレスリリース</button> <button class="f-btn text-xs px-4 py-1.5 rounded-full border border-gray-200 text-gray-500 font-medium hover:border-green-DEFAULT hover:text-green-DEFAULT transition" data-cat="メディア掲載">メディア掲載</button> <button class="f-btn text-xs px-4 py-1.5 rounded-full border border-gray-200 text-gray-500 font-medium hover:border-green-DEFAULT hover:text-green-DEFAULT transition" data-cat="お知らせ">お知らせ</button> </div> <div id="news-grid" class=""></div> <p id="news-empty" class="hidden text-center py-16 text-gray-400 text-sm">該当する記事がありません。</p> </div>
</section>
<style>
.f-btn.active{background:#80B020;color:#fff;border-color:#80B020}
</style>
<script src="../news-data.js"></script>
<script>
// データは news-data.js で管理しています

let currentCat = 'all';

const fmt = d => {
  const t = new Date(d);
  return `${t.getFullYear()}.${String(t.getMonth()+1).padStart(2,'0')}.${String(t.getDate()).padStart(2,'0')}`;
};

function render() {
  const items = currentCat === 'all' ? NEWS : NEWS.filter(n => n.category === currentCat);
  const grid = document.getElementById('news-grid');
  const empty = document.getElementById('news-empty');
  if (!items.length) {
    grid.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');
  grid.innerHTML = items.map(n => `
    <a href="${n.link}"${n.link.startsWith('http') ? ' target="_blank" rel="noopener"' : ''}
       class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4 py-4 border-t border-gray-100 hover:text-green-DEFAULT transition group">
      <time class="font-en text-xs text-gray-400 shrink-0">${fmt(n.date)}</time>
      <span class="text-xs px-2 py-0.5 border border-green-DEFAULT text-green-dark bg-green-50 shrink-0 w-fit">${n.category}</span>
      <p class="text-sm text-gray-700 group-hover:text-green-DEFAULT transition">${n.title}</p>
    </a>
  `).join('');
}

document.getElementById('filter-bar').addEventListener('click', e => {
  const btn = e.target.closest('.f-btn');
  if (!btn) return;
  document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentCat = btn.dataset.cat;
  render();
});

render();
</script>
<script>
(function(){
  const path = (location.pathname.replace(/index\.html$/, '').replace(/\/$/, '') || '') + '/';
  const rootPrefix = '../';
  const resolvePartsPaths = (html) => html
    .replace(/(href|src)=\"\/\"/g, '$1=\"../\"')
    .replace(/(href|src)=\"\/([^\"]+)\"/g, '$1=\"' + rootPrefix + '$2\"');
  fetch('../parts/nav.html')
    .then(r => r.text())
    .then(html => {
      html = resolvePartsPaths(html);
      document.getElementById('nav-placeholder').innerHTML = html;
      document.querySelectorAll('#nav-placeholder a').forEach(a => {
        if (a.getAttribute('href') === path) {
          a.classList.remove('text-gray-700','hover:text-green-DEFAULT','transition');
          a.classList.add('text-green-DEFAULT');
        }
      });
      const toggle = document.getElementById('menu-toggle');
      const nav = document.getElementById('mobile-nav');
      if (toggle && nav) {
        const spans = toggle.querySelectorAll('span');
        toggle.addEventListener('click', () => {
          nav.classList.toggle('open');
          spans[0].classList.toggle('rotate-45');
          spans[0].classList.toggle('translate-y-2');
          spans[1].classList.toggle('opacity-0');
          spans[2].classList.toggle('-rotate-45');
          spans[2].classList.toggle('-translate-y-2');
        });
        nav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
          nav.classList.remove('open');
          spans[0].classList.remove('rotate-45','translate-y-2');
          spans[1].classList.remove('opacity-0');
          spans[2].classList.remove('-rotate-45','-translate-y-2');
        }));
      }
    });
  fetch('../parts/footer.html')
    .then(r => r.text())
    .then(html => { html = resolvePartsPaths(html);
      document.getElementById('footer-placeholder').innerHTML = html; });
})();
</script>

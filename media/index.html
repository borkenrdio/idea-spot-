<section class="bg-gray-50 py-20 border-b border-gray-100"> <div class="max-w-6xl mx-auto px-6"> <p class="font-en text-xs tracking-[.15em] uppercase text-green-DEFAULT mb-2">Media</p> <h1 class="font-serif text-3xl md:text-4xl font-medium text-gray-800 section-line">メディア掲載</h1> </div>
</section>
<section class="py-16 bg-white"> <div class="max-w-5xl mx-auto px-6"> <p class="text-sm text-gray-500 mb-8">代表竹山の関連記事</p> <div id="featured-grid" class="grid md:grid-cols-2 gap-6 mb-10"></div> <div id="media-list"></div> <p id="media-empty" class="hidden text-center py-16 text-gray-400 text-sm">該当する記事がありません。</p> </div>
</section>
<style>.f-btn.active{background:#80B020;color:#fff;border-color:#80B020}</style>
<script src="../media-data.js"></script>
<script>
const CAT_COLOR = {
  '寄稿': 'bg-green-50 text-green-dark border-green-DEFAULT',
  '取材': 'bg-blue-50 text-blue-700 border-blue-300',
  'プレスリリース': 'bg-yellow-50 text-yellow-700 border-yellow-300',
};

const fmt = d => {
  const t = new Date(d);
  return `${t.getFullYear()}.${String(t.getMonth() + 1).padStart(2, '0')}.${String(t.getDate()).padStart(2, '0')}`;
};

const catBadge = cat => {
  const cls = CAT_COLOR[cat] || 'bg-gray-100 text-gray-600 border-gray-300';
  return `<span class="text-xs font-medium px-2 py-0.5 border rounded-sm ${cls}">${cat}</span>`;
};

const imageSrc = src => src && !/^(https?:|\/|\.\.\/)/.test(src) ? `../${src}` : src;

const imageMarkup = a => a.image
  ? `<img src="${imageSrc(a.image)}" alt="${a.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">`
  : '<div class="w-full h-full bg-gradient-to-br from-gray-100 to-gray-200"></div>';

function render(items) {
  const featured = document.getElementById('featured-grid');
  const list = document.getElementById('media-list');
  const empty = document.getElementById('media-empty');

  if (!items.length) {
    featured.innerHTML = '';
    list.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }

  empty.classList.add('hidden');

  featured.innerHTML = items.slice(0, 2).map(a => `
    <a href="${a.url}" target="_blank" rel="noopener"
       class="group block border border-gray-100 hover:border-green-DEFAULT hover:shadow-lg transition-all overflow-hidden">
      <div class="aspect-[16/9] bg-gray-100 overflow-hidden">${imageMarkup(a)}</div>
      <div class="p-5">
        <div class="mb-3">${catBadge(a.cat)}</div>
        <p class="font-serif text-base font-medium text-gray-800 leading-snug mb-3 group-hover:text-green-DEFAULT transition">${a.title}</p>
        <p class="text-sm text-gray-500 leading-relaxed mb-4">${a.description || ''}</p>
        <div class="flex items-center justify-between gap-4">
          <div class="flex items-center gap-3 min-w-0">
            <time class="font-en text-xs text-gray-400">${fmt(a.date)}</time>
            <span class="text-xs text-gray-400 truncate">${a.source}</span>
          </div>
          <span class="font-en text-xs text-green-DEFAULT group-hover:translate-x-1 transition-transform inline-block shrink-0">Read →</span>
        </div>
      </div>
    </a>
  `).join('');

  const rest = items.slice(2);
  list.innerHTML = rest.length ? `
    <div class="grid sm:grid-cols-2 md:grid-cols-3 gap-5 mt-2">
      ${rest.map(a => `
        <a href="${a.url}" target="_blank" rel="noopener"
           class="group block border border-gray-100 hover:border-green-DEFAULT hover:shadow-md transition-all overflow-hidden">
          <div class="aspect-[16/9] bg-gray-100 overflow-hidden">${imageMarkup(a)}</div>
          <div class="p-4">
            <div class="mb-3">${catBadge(a.cat)}</div>
            <p class="text-sm font-medium text-gray-800 leading-snug mb-2 group-hover:text-green-DEFAULT transition">${a.title}</p>
            <p class="text-xs text-gray-500 leading-relaxed mb-3">${a.description || ''}</p>
            <div class="flex items-center gap-2">
              <time class="font-en text-xs text-gray-400">${fmt(a.date)}</time>
              <span class="text-xs text-gray-300">|</span>
              <span class="text-xs text-gray-400">${a.source}</span>
            </div>
          </div>
        </a>
      `).join('')}
    </div>` : '';
}

render(ARTICLES);
</script>
<div id="footer-placeholder"></div>


<script>
(function(){
  const path = (location.pathname.replace(/index\.html$/, '').replace(/\/$/, '') || '') + '/';
  const rootPrefix = '../';
  const resolvePartsPaths = (html) => html
    .replace(/(href|src)=\"\/\"/g, '$1=\"../\"')
    .replace(/(href|src)=\"\/([^\"]+)\"/g, '$1=\"' + rootPrefix + '$2\"');
  fetch('../parts/nav.html')
    .then(r => r.text())
    .then(html => {
      html = resolvePartsPaths(html);
      document.getElementById('nav-placeholder').innerHTML = html;
      document.querySelectorAll('#nav-placeholder a').forEach(a => {
        if (a.getAttribute('href') === path) {
          a.classList.remove('text-gray-700','hover:text-green-DEFAULT','transition');
          a.classList.add('text-green-DEFAULT');
        }
      });
      const toggle = document.getElementById('menu-toggle');
      const nav = document.getElementById('mobile-nav');
      if (toggle && nav) {
        const spans = toggle.querySelectorAll('span');
        toggle.addEventListener('click', () => {
          nav.classList.toggle('open');
          spans[0].classList.toggle('rotate-45');
          spans[0].classList.toggle('translate-y-2');
          spans[1].classList.toggle('opacity-0');
          spans[2].classList.toggle('-rotate-45');
          spans[2].classList.toggle('-translate-y-2');
        });
        nav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
          nav.classList.remove('open');
          spans[0].classList.remove('rotate-45','translate-y-2');
          spans[1].classList.remove('opacity-0');
          spans[2].classList.remove('-rotate-45','-translate-y-2');
        }));
      }
    });
  fetch('../parts/footer.html')
    .then(r => r.text())
    .then(html => { html = resolvePartsPaths(html);
      document.getElementById('footer-placeholder').innerHTML = html; });
})();
</script>

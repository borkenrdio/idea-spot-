<body class="bg-white">
<div id="nav-placeholder"></div>

<!-- ページヘッダー -->
<section class="bg-gray-50 py-20 border-b border-gray-100">
  <div class="max-w-5xl mx-auto px-6">
    <p class="font-en text-xs tracking-[.2em] uppercase text-green-DEFAULT mb-2">Philosophy</p>
    <h1 class="font-serif text-3xl md:text-4xl font-medium text-gray-800 section-line">会社理念</h1>
  </div>
</section>

<!-- ミッション -->
<section class="py-24 bg-white">
  <div class="max-w-5xl mx-auto px-6">
    <div>
      <p class="font-en text-xs tracking-[.2em] uppercase text-green-DEFAULT mb-2">Mission</p>
      <p class="text-xs text-gray-400 tracking-widest mb-10">— ミッション —</p>
      <h2 class="font-serif leading-tight text-gray-900 md:whitespace-nowrap"
          style="font-size:clamp(1.5rem,4vw,3.25rem);font-weight:500;letter-spacing:-.01em">
        教育を、<span class="relative inline-block">
          <span class="relative z-10">憧れの職業</span>
          <span class="absolute bottom-1 left-0 w-full h-2 bg-green-DEFAULT/20 z-0" aria-hidden="true"></span>
        </span>へと再定義する。
      </h2>
    </div>
  </div>
</section>

<!-- ビジョン -->
<section class="py-24 bg-gray-50 border-t border-gray-100">
  <div class="max-w-5xl mx-auto px-6">
    <div class="max-w-5xl">
      <p class="font-en text-xs tracking-[.2em] uppercase text-green-DEFAULT mb-2">Vision</p>
      <p class="text-xs text-gray-400 tracking-widest mb-10">— ビジョン —</p>
      <h2 class="font-serif leading-tight text-gray-900"
          style="font-size:clamp(1.5rem,3.4vw,2.75rem);font-weight:500;letter-spacing:0;word-break:keep-all;overflow-wrap:normal">
        日本一、教育者が豊かに、クリエイティブに<br>働ける場所をつくる。
      </h2>
    </div>
  </div>
</section>

<div id="footer-placeholder"></div>


<script>
(function(){
  const path = (location.pathname.replace(/index\.html$/, '').replace(/\/$/, '') || '') + '/';
  const rootPrefix = '../';
  const resolvePartsPaths = (html) => html
    .replace(/(href|src)=\"\/\"/g, '$1=\"../\"')
    .replace(/(href|src)=\"\/([^\"]+)\"/g, '$1=\"' + rootPrefix + '$2\"');
  fetch('../parts/nav.html')
    .then(r => r.text())
    .then(html => {
      html = resolvePartsPaths(html);
      document.getElementById('nav-placeholder').innerHTML = html;
      document.querySelectorAll('#nav-placeholder a').forEach(a => {
        if (a.getAttribute('href') === path) {
          a.classList.remove('text-gray-700','hover:text-green-DEFAULT','transition');
          a.classList.add('text-green-DEFAULT');
        }
      });
      const toggle = document.getElementById('menu-toggle');
      const nav = document.getElementById('mobile-nav');
      if (toggle && nav) {
        const spans = toggle.querySelectorAll('span');
        toggle.addEventListener('click', () => {
          nav.classList.toggle('open');
          spans[0].classList.toggle('rotate-45');
          spans[0].classList.toggle('translate-y-2');
          spans[1].classList.toggle('opacity-0');
          spans[2].classList.toggle('-rotate-45');
          spans[2].classList.toggle('-translate-y-2');
        });
        nav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
          nav.classList.remove('open');
          spans[0].classList.remove('rotate-45','translate-y-2');
          spans[1].classList.remove('opacity-0');
          spans[2].classList.remove('-rotate-45','-translate-y-2');
        }));
      }
    });
  fetch('../parts/footer.html')
    .then(r => r.text())
    .then(html => { html = resolvePartsPaths(html);
      document.getElementById('footer-placeholder').innerHTML = html; });
})();
</script>
</body>
